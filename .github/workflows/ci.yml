name: CI - Academia Java

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar todas as classes
        run: |
          mkdir -p out
          find src -name '*.java' -print0 | \
            xargs -0 javac -encoding UTF-8 -d out
          test -f out/app/Main.class
